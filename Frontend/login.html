<!DOCTYPE html>
<html>
<head>
<title>Login</title>
</head>
<body>

<h2>Login</h2>

<input type="password" id="pass">
<button onclick="login()">Login</button>

<script>
function login(){

let p=document.getElementById("pass").value;

if(p==="gowtham123"){
localStorage.setItem("loggedIn","true");
window.location.href="index.html";
}else{
alert("Wrong Password");
}

}
</script>

</body>
</html>
